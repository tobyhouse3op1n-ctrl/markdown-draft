version: 2.1

jobs:
  install_sierra-6:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Reconcile output files
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/share/counts.tsv; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/share/counts.tsv; done; true
            size=$(wc -c </tmp/share/counts.tsv); echo "stage ok: sierra-6 size=${size}"
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - counts.tsv
  sierra-6:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Load artifact
          command: |
            { tail -c 100 /tmp/share/counts.tsv > /dev/null; echo "tail ok" ; } || true
      - run:
          name: Fetch artifact
          command: git clone --depth 3 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat files.tar.xz | tar xJf -
      - run:
          no_output_timeout: 101m
          command: sh -c "./play"
  produce_rc-v8:
